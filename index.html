<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpikeDrops</title>
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpikeDrops">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0b0d14;
  --surface: #13162a;
  --surface2: #1c2040;
  --surface3: #222647;
  --border: #2a2f5a;
  --text: #e2e8f0;
  --muted: #7c87a6;
  --market: #3b82f6;
  --industry: #f59e0b;
  --company: #8b5cf6;
  --up: #10b981;
  --down: #ef4444;
  --alert: #fbbf24;
  --high: #10b981;
  --moderate: #f59e0b;
  --low: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* HEADER */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 58px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.logo-mark { font-size: 22px; }
.header-meta { display: flex; align-items: center; gap: 14px; }
.refresh-time { font-size: 12px; color: var(--muted); }

/* TICKER BAR */
.ticker-bar { background: #0d0f1c; border-bottom: 1px solid var(--border); display: flex; align-items: stretch; height: 36px; overflow: hidden; position: sticky; top: 58px; z-index: 99; }
.ticker-tabs { display: flex; flex-shrink: 0; }
.ticker-tab { padding: 0 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); cursor: pointer; border: none; background: none; border-right: 1px solid var(--border); height: 100%; transition: color 0.15s, background 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.ticker-tab:hover { color: var(--text); background: var(--surface2); }
.ticker-tab.active { color: var(--text); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--market); }
.ticker-tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; }
.ticker-wrap { flex: 1; overflow: hidden; mask-image: linear-gradient(to right, transparent, black 2%, black 98%, transparent); min-width: 0; }
.ticker-scroll { display: inline-flex; align-items: center; white-space: nowrap; animation: tickerMove 60s linear infinite; }
.ticker-scroll:hover { animation-play-state: paused; cursor: default; }
@keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.ticker-item { display: inline-flex; align-items: center; gap: 5px; padding: 0 16px; font-size: 12px; border-right: 1px solid var(--border); height: 36px; }
.ticker-sym { font-weight: 700; color: var(--text); }
.ticker-name { color: var(--muted); font-size: 11px; }
.ticker-price { color: var(--muted); }
.ticker-chg { font-weight: 600; }
.ticker-chg.pos { color: var(--up); }
.ticker-chg.neg { color: var(--down); }
.ticker-weight { font-size: 10px; color: var(--muted); background: var(--surface2); padding: 1px 5px; border-radius: 3px; }
.ticker-section { display: inline-flex; align-items: center; padding: 0 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-right: 1px solid var(--border); height: 36px; white-space: nowrap; }
.ticker-section.up { color: var(--up); }
.ticker-section.dn { color: var(--down); }
.ticker-section.neutral { color: var(--muted); }
.ticker-loading { font-size: 11px; color: var(--muted); padding: 0 16px; display: flex; align-items: center; height: 36px; }
.ticker-badge { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.06em; }
.badge-buy  { background: rgba(16,185,129,0.15); color: var(--up);   border: 1px solid rgba(16,185,129,0.3); }
.badge-sell { background: rgba(239,68,68,0.12);  color: var(--down); border: 1px solid rgba(239,68,68,0.25); }

/* BUTTONS */
.btn { padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s; }
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--market); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-full { width: 100%; }

/* LAYOUT */
.main { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 290px 1fr; gap: 24px; align-items: start; }

/* SIDEBAR */
.sidebar { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 16px; }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.card-heading { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 16px; }

/* FORM */
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 5px; }
.input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 11px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.15s; }
.input:focus { border-color: var(--market); }
.input-wrap { position: relative; }
.input-suffix { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.suggest-item { padding: 8px 11px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; font-size: 13px; border-bottom: 1px solid var(--border); }
.suggest-item:last-child { border-bottom: none; }
.suggest-item:hover, .suggest-item.active { background: var(--surface2); }
.suggest-sym { font-weight: 700; color: var(--text); min-width: 52px; text-transform: uppercase; }
.suggest-name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest-type { font-size: 10px; color: var(--muted); opacity: .6; margin-left: auto; flex-shrink: 0; }
.help { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

/* LEGEND */
.legend { display: flex; flex-direction: column; gap: 11px; }
.legend-row { display: flex; gap: 10px; align-items: flex-start; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.legend-row strong { font-size: 12px; display: block; margin-bottom: 1px; }
.legend-row p { font-size: 11px; color: var(--muted); line-height: 1.35; }

/* CONTENT */
.content { display: flex; flex-direction: column; gap: 14px; }

/* BANNERS */
.banner { border-radius: 9px; padding: 11px 15px; font-size: 13px; }
.banner-alert { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: var(--alert); }
.banner-error { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
.banner-info { background: rgba(59,130,246,0.07); border: 1px solid rgba(59,130,246,0.2); color: #93c5fd; }

/* STOCK GRID */
.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.empty-state { grid-column: 1/-1; text-align: center; padding: 64px 20px; color: var(--muted); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* STOCK CARD */
.stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.25s; }
.stock-card.is-flagged { border-color: var(--alert); box-shadow: 0 0 0 1px rgba(251,191,36,0.15), 0 4px 20px rgba(0,0,0,0.3); }
.stock-card.is-loading { opacity: 0.6; }
.stock-card.is-error { border-color: rgba(239,68,68,0.3); }

.sc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
.sc-title { display: flex; align-items: center; gap: 8px; }
.sc-ticker { font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
.sc-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; }
.badge-flagged { background: rgba(251,191,36,0.12); color: var(--alert); border: 1px solid rgba(251,191,36,0.3); }
.badge-normal { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.sc-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 5px; border-radius: 5px; line-height: 1; }
.sc-remove:hover { background: var(--surface2); color: var(--text); }

.sc-name { font-size: 12px; color: var(--muted); margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sc-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.sc-price { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.sc-change { font-size: 15px; font-weight: 600; }
.sc-meta { font-size: 11px; color: var(--muted); margin-bottom: 14px; }

.pos { color: var(--up); }
.neg { color: var(--down); }

/* PRICE MOVEMENT AUTOPSY */
.autopsy-toggle { background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
.autopsy-toggle:hover { color: var(--text); border-color: var(--muted); }
.autopsy { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; margin: -4px 0 14px; }
.ap-head { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
.ap-row { display: grid; grid-template-columns: 10px 1fr 62px 36px; gap: 8px; align-items: center; padding: 3px 0; font-size: 11.5px; }
.ap-dot { width: 8px; height: 8px; border-radius: 50%; }
.ap-src { color: var(--muted); }
.ap-val { font-weight: 700; text-align: right; }
.ap-share { font-size: 10px; color: var(--muted); text-align: right; }
.ap-conf { font-size: 11px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.ap-info { cursor: help; opacity: 0.7; }
.ap-sec { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 12px 0 5px; }
.ap-list { margin: 0 0 0 16px; font-size: 11.5px; line-height: 1.5; color: var(--text); }
.ap-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.ap-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--border); }
.ap-table td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--border); }
.ap-table tr:last-child td { border-bottom: none; }
.ap-own { display: grid; grid-template-columns: 1fr 90px 82px; gap: 8px; align-items: center; padding: 3px 0; font-size: 11px; color: var(--muted); }
.ap-own b { color: var(--text); text-align: right; font-size: 10.5px; }
.ap-bar-bg { background: var(--surface); border: 1px solid var(--border); height: 7px; border-radius: 3px; overflow: hidden; }
.ap-bar-fill { height: 100%; background: var(--market); border-radius: 3px; }
.ap-mr { font-size: 11.5px; line-height: 1.55; color: var(--text); display: flex; gap: 8px; align-items: flex-start; }

/* PORTFOLIO SUMMARY */
.pf-card { grid-column: 1 / -1; }
.pf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; margin-bottom: 12px; }
.pf-item { display: flex; flex-direction: column; gap: 2px; }
.pf-k { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pf-v { font-size: 14px; font-weight: 700; }
.pf-risk-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }

/* AUTH GATE */
.auth-overlay { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
.auth-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; font-size: 20px; font-weight: 800; }
.auth-sub { text-align: center; color: var(--muted); font-size: 12.5px; margin-bottom: 20px; }
.auth-error { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 15px; text-align: center; }
.auth-switch { text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.auth-switch a { color: var(--market); cursor: pointer; text-decoration: none; }
.auth-switch a:hover { text-decoration: underline; }

/* COMPANY HEALTH RATING */
.health-toggle { background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
.health-toggle:hover { color: var(--text); border-color: var(--muted); }
.health-section { margin: -4px 0 14px; }
.health-row { display: grid; grid-template-columns: 118px 1fr 74px; gap: 8px; align-items: center; padding: 3px 0; font-size: 11.5px; }
.health-label { color: var(--muted); font-weight: 600; }
.health-bar-bg { background: var(--surface2); height: 8px; border-radius: 4px; overflow: hidden; }
.health-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.health-verdict { font-weight: 700; text-align: right; font-size: 10.5px; white-space: nowrap; }

/* SIDEBAR — BERKSHIRE MOVES & TOP STORIES */
.brk-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.brk-row:last-of-type { border-bottom: none; }
.brk-badge { flex-shrink: 0; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.05em; white-space: nowrap; }
.brk-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brk-amt { font-weight: 700; flex-shrink: 0; font-size: 11.5px; }
.story-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.story-row:last-child { border-bottom: none; }
.story-rank { font-size: 15px; font-weight: 800; color: var(--muted); line-height: 1.3; flex-shrink: 0; }
.story-title { font-size: 12.5px; line-height: 1.4; color: var(--text); text-decoration: none; display: block; }
.story-title:hover { color: var(--market); text-decoration: underline; }
.story-meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* FUNDAMENTALS STRIP */
.sc-stats { display: flex; gap: 22px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; margin: -4px 0 14px; }
.sc-stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sc-stat-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.sc-stat-val { font-size: 13px; font-weight: 700; white-space: nowrap; }
.sc-stat-val .pos, .sc-stat-val .neg { font-size: 11px; font-weight: 600; }

/* DIVIDER */
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* ATTRIBUTION */
.attr-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.attr-section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

.attr-chart-wrap { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.attr-chart-canvas { flex-shrink: 0; }
.attr-summary-text { flex: 1; }
.attr-summary-line { font-size: 13px; line-height: 1.55; color: var(--muted); }
.attr-summary-line strong { color: var(--text); }

.attr-bars { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.attr-bar-row { display: grid; grid-template-columns: 60px 1fr 38px 68px; align-items: center; gap: 7px; }
.attr-bar-label { font-size: 11px; font-weight: 600; }
.attr-bar-bg { background: var(--surface2); border-radius: 3px; height: 7px; overflow: hidden; }
.attr-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.fill-market { background: var(--market); }
.fill-industry { background: var(--industry); }
.fill-company { background: var(--company); }
.attr-bar-pct { font-size: 11px; font-weight: 700; text-align: right; }
.attr-bar-val { font-size: 10px; color: var(--muted); }
.attr-bar-label.lbl-market { color: var(--market); }
.attr-bar-label.lbl-industry { color: var(--industry); }
.attr-bar-label.lbl-company { color: var(--company); }

/* RECOVERY BOX */
.recovery-box { border-radius: 8px; padding: 12px 14px; border: 1px solid; margin-bottom: 10px; }
.recovery-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.recovery-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.recovery-prob { font-size: 20px; font-weight: 800; }
.recovery-level { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.recovery-reason { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* OPPORTUNITY SCORE */
.opp-score-row { display: flex; align-items: center; gap: 10px; }
.opp-score-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.opp-score-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.opp-score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.opp-score-val { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; }

/* EVENT TAG */
.event-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-top: 6px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }

/* NARRATIVE */
.narrative { font-size: 12px; line-height: 1.55; color: var(--muted); margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 7px; border-left: 3px solid var(--market); }
.narrative strong { color: var(--text); }

/* MINI ATTRIBUTION (non-flagged) */
.mini-attr { margin-top: 2px; }
.mini-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin: 5px 0 4px; }
.mini-seg { height: 100%; }
.mini-legend { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--muted); }
.mini-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 2px; }

/* LOADING SPINNER */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--market); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ERROR */
.error-text { color: #ef4444; font-size: 12px; margin-top: 6px; }

/* RESPONSIVE */
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; padding: 14px; }
  .sidebar { position: static; }
}
@media (max-width: 480px) {
  .stock-grid { grid-template-columns: 1fr; }
  .attr-chart-wrap { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const SECTOR_ETFS = {
  'Technology': 'XLK',
  'Healthcare': 'XLV',
  'Financials': 'XLF',
  'Consumer Discretionary': 'XLY',
  'Consumer Staples': 'XLP',
  'Energy': 'XLE',
  'Utilities': 'XLU',
  'Materials': 'XLB',
  'Industrials': 'XLI',
  'Real Estate': 'XLRE',
  'Communication Services': 'XLC',
};

// Historical mean-reversion probabilities by attribution source (estimated from academic literature)
const RECOVERY_RATES = { market: 0.76, industry: 0.54, company: 0.28 };

// Opportunity score weights
const OPP_WEIGHTS = { market: 0.75, industry: 0.52, company: 0.18 };

const MARKET_TICKER = 'SPY';
const REGRESSION_WINDOW = 60;
const REFRESH_MS = 5 * 60 * 1000;

// Multiple proxies tried in order — first success wins
const PROXY_FNS = [
  url => `https://nameless-moon-cd4e.adam-89b.workers.dev/?url=${encodeURIComponent(url)}`,
];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let trackedStocks = JSON.parse(localStorage.getItem('smt_stocks') || '[]');
let results = {};
let marketCache = null;
let sectorCache = {};
let chartInstances = {};
let isRefreshing = false;
let healthOpen = new Set();

// ═══════════════════════════════════════════════════════════
//  MEMBER GATE
//  Accounts live in this browser's localStorage only; passwords
//  are stored as salted SHA-256 hashes, never as plain text.
// ═══════════════════════════════════════════════════════════
let authMode = Object.keys(JSON.parse(localStorage.getItem('sd_users') || '{}')).length ? 'signin' : 'signup';

function isSignedIn() { return !!localStorage.getItem('sd_session'); }

function currentUser() {
  try {
    const users = JSON.parse(localStorage.getItem('sd_users') || '{}');
    const email = localStorage.getItem('sd_session');
    return users[email] ? { email, name: users[email].name } : null;
  } catch { return null; }
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function renderAuthGate() {
  let el = document.getElementById('auth-gate');
  if (!el) {
    el = document.createElement('div');
    el.id = 'auth-gate';
    el.className = 'auth-overlay';
    document.body.appendChild(el);
  }
  const signup = authMode === 'signup';
  el.innerHTML = `
    <div class="auth-card">
      <div class="auth-logo"><span>📈</span> SpikeDrops</div>
      <div class="auth-sub">${signup ? 'Create your free account to access the tracker' : 'Sign in to access your stock tracker'}</div>
      <form onsubmit="return handleAuthSubmit(event)">
        ${signup ? `<div class="field"><label>Name</label><input id="auth-name" class="input" type="text" autocomplete="name" required></div>` : ''}
        <div class="field"><label>Email</label><input id="auth-email" class="input" type="email" autocomplete="email" required></div>
        <div class="field"><label>Password</label><input id="auth-pw" class="input" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" required></div>
        <button class="btn btn-primary btn-full" type="submit">${signup ? 'Create Account' : 'Sign In'}</button>
        <div class="auth-error" id="auth-error"></div>
      </form>
      <div class="auth-switch">${signup
        ? `Already a member? <a onclick="switchAuthMode('signin')">Sign in</a>`
        : `New here? <a onclick="switchAuthMode('signup')">Create an account</a>`}</div>
      <p class="help" style="text-align:center;margin-top:14px">Accounts are stored privately in this browser only — nothing is sent to a server.</p>
    </div>`;
}

function switchAuthMode(mode) {
  authMode = mode;
  renderAuthGate();
}

function handleAuthSubmit(ev) {
  ev.preventDefault();
  (async () => {
    const err = document.getElementById('auth-error');
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    const pw = document.getElementById('auth-pw').value;
    const users = JSON.parse(localStorage.getItem('sd_users') || '{}');
    if (authMode === 'signup') {
      const name = document.getElementById('auth-name').value.trim();
      if (!name) { err.textContent = 'Please enter your name.'; return; }
      if (users[email]) { err.textContent = 'An account with this email already exists — sign in instead.'; return; }
      if (pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
      const salt = [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('');
      users[email] = { name, salt, hash: await sha256Hex(salt + pw) };
      localStorage.setItem('sd_users', JSON.stringify(users));
      localStorage.setItem('sd_session', email);
      location.reload();
    } else {
      const u = users[email];
      if (!u || (await sha256Hex(u.salt + pw)) !== u.hash) { err.textContent = 'Invalid email or password.'; return; }
      localStorage.setItem('sd_session', email);
      location.reload();
    }
  })();
  return false;
}

function signOut() {
  localStorage.removeItem('sd_session');
  location.reload();
}

// ═══════════════════════════════════════════════════════════
//  DASHBOARD TRANSFER
//  Encode the tracked-stock list into a shareable URL so the
//  dashboard can be carried into the Dock app / other browsers
//  (each browser keeps its own separate localStorage copy).
// ═══════════════════════════════════════════════════════════
function copyDashboardLink() {
  if (!trackedStocks.length) return alert('No stocks tracked yet — add some first.');
  const url = location.origin + location.pathname + '#s=' + encodeURIComponent(btoa(JSON.stringify(trackedStocks)));
  const done = () => alert('Dashboard link copied!\n\nOpen it in the Dock app (or any browser) and your tracked stocks will import automatically.');
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => prompt('Copy this link:', url));
  } else {
    prompt('Copy this link:', url);
  }
}

function importFromHash() {
  if (!location.hash.startsWith('#s=')) return;
  try {
    const list = JSON.parse(atob(decodeURIComponent(location.hash.slice(3))));
    if (!Array.isArray(list)) throw new Error('bad format');
    let added = 0;
    for (const s of list) {
      const ticker = String(s.ticker || '').toUpperCase().slice(0, 10);
      const threshold = parseFloat(s.threshold);
      if (!ticker || !SECTOR_ETFS[s.sector] || isNaN(threshold) || threshold <= 0 || threshold > 50) continue;
      if (trackedStocks.find(t => t.ticker === ticker)) continue;
      trackedStocks.push({ ticker, sector: s.sector, threshold });
      added++;
    }
    if (added) localStorage.setItem('smt_stocks', JSON.stringify(trackedStocks));
  } catch {}
  history.replaceState(null, '', location.pathname + location.search);
}

// ═══════════════════════════════════════════════════════════
//  DATA FETCHING
// ═══════════════════════════════════════════════════════════
function parseYFJson(json, ticker) {
  if (json.chart?.error) throw new Error(json.chart.error.description || 'Yahoo Finance error');
  const r = json.chart?.result?.[0];
  if (!r) throw new Error('No data returned');
  const ts = r.timestamp || [];
  const adj = r.indicators?.adjclose?.[0]?.adjclose;
  const raw = r.indicators?.quote?.[0]?.close;
  const closes = adj || raw || [];
  const prices = [];
  for (let i = 0; i < ts.length; i++) {
    if (closes[i] != null && closes[i] > 0)
      prices.push({ date: new Date(ts[i] * 1000), close: closes[i] });
  }
  return {
    ticker: ticker.toUpperCase(),
    name: r.meta?.longName || r.meta?.shortName || ticker.toUpperCase(),
    currentPrice: r.meta?.regularMarketPrice ?? prices[prices.length - 1]?.close ?? null,
    previousClose: r.meta?.previousClose ?? prices[prices.length - 2]?.close ?? null,
    prices
  };
}

async function fetchYF(ticker) {
  const yfUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker.toUpperCase())}?range=3mo&interval=1d`;
  let lastError;
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(yfUrl));
      if (!res.ok) { lastError = new Error(`HTTP ${res.status}`); continue; }
      const json = await res.json();
      return parseYFJson(json, ticker);
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error(`Could not fetch ${ticker}`);
}

async function fetchNews(ticker) {
  const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(ticker)}&quotesCount=0&newsCount=6&enableFuzzyQuery=false`;
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(url));
      if (!res.ok) continue;
      const json = await res.json();
      return (json.news || []).map(n => n.title || '');
    } catch {}
  }
  return [];
}

async function fetchFundamentals(ticker) {
  // P/E ratio + analyst price targets. The proxy worker handles Yahoo's
  // cookie/crumb authentication for this endpoint server-side.
  const url = `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(ticker.toUpperCase())}?modules=summaryDetail%2CfinancialData%2CdefaultKeyStatistics%2CearningsHistory`;
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(url));
      if (!res.ok) continue;
      const json = await res.json();
      const r = json?.quoteSummary?.result?.[0];
      if (!r) continue;
      const sd = r.summaryDetail || {};
      const fd = r.financialData || {};
      const ks = r.defaultKeyStatistics || {};
      const g = o => o?.raw ?? null;
      return {
        trailingPE: g(sd.trailingPE),
        forwardPE: g(sd.forwardPE),
        targetMean: g(fd.targetMeanPrice),
        targetHigh: g(fd.targetHighPrice),
        targetLow: g(fd.targetLowPrice),
        analysts: g(fd.numberOfAnalystOpinions),
        m: {
          returnOnEquity: g(fd.returnOnEquity),
          debtToEquity: g(fd.debtToEquity),
          currentRatio: g(fd.currentRatio),
          quickRatio: g(fd.quickRatio),
          totalCash: g(fd.totalCash),
          totalDebt: g(fd.totalDebt),
          profitMargins: g(fd.profitMargins),
          operatingMargins: g(fd.operatingMargins),
          returnOnAssets: g(fd.returnOnAssets),
          revenueGrowth: g(fd.revenueGrowth),
          earningsGrowth: g(fd.earningsGrowth),
          dividendYield: g(sd.dividendYield),
          payoutRatio: g(sd.payoutRatio),
          fiveYearAvgDividendYield: g(sd.fiveYearAvgDividendYield),
          trailingPE: g(sd.trailingPE),
          forwardPE: g(sd.forwardPE),
          priceToSales: g(sd.priceToSalesTrailing12Months),
          priceToBook: g(ks.priceToBook),
          pegRatio: g(ks.pegRatio),
        },
        // Intrinsic-value inputs
        trailingEps: g(ks.trailingEps),
        forwardEps: g(ks.forwardEps),
        earningsGrowth: g(fd.earningsGrowth),
        // Ownership & positioning (latest reported figures)
        own: {
          instPct: g(ks.heldPercentInstitutions),
          insiderPct: g(ks.heldPercentInsiders),
          shortPctFloat: g(ks.shortPercentOfFloat),
          shortRatio: g(ks.shortRatio),
          sharesShort: g(ks.sharesShort),
          sharesShortPrior: g(ks.sharesShortPriorMonth),
          shortDate: g(ks.dateShortInterest),
          beta: g(ks.beta),
        },
        // Expectations vs reality: last 4 quarters of consensus vs actual EPS
        earnHistory: (r.earningsHistory?.history || []).map(q => ({
          quarter: q.quarter?.fmt || '',
          est: g(q.epsEstimate),
          actual: g(q.epsActual),
          surprise: g(q.surprisePercent),
        })).filter(q => q.est != null && q.actual != null).slice(-4),
      };
    } catch {}
  }
  return null;
}

// ═══════════════════════════════════════════════════════════
//  COMPANY HEALTH RATING
//  Heuristic 0–100 scores per category from Yahoo fundamentals.
//  ≥70 green (excellent) · 40–69 blue (moderate) · <40 red (stay away)
// ═══════════════════════════════════════════════════════════
function scoreHigher(v, worst, best) {
  if (v == null || isNaN(v)) return null;
  if (v <= worst) return 0;
  if (v >= best) return 100;
  return (v - worst) / (best - worst) * 100;
}

function scoreLower(v, best, worst) {
  if (v == null || isNaN(v)) return null;
  if (v <= best) return 100;
  if (v >= worst) return 0;
  return (worst - v) / (worst - best) * 100;
}

function avgScores(arr) {
  const v = arr.filter(s => s != null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function computeHealth(m) {
  if (!m) return null;
  // Dividend payout sweet spot is roughly 15–65% of earnings
  const payoutScore = m.payoutRatio == null ? null
    : m.payoutRatio <= 0 ? 30
    : m.payoutRatio <= 0.15 ? 70
    : m.payoutRatio <= 0.65 ? 100
    : m.payoutRatio <= 1 ? Math.max(0, 100 - (m.payoutRatio - 0.65) * 250)
    : 0;
  return [
    { label: 'Shareholder Equity', score: avgScores([
        scoreHigher(m.returnOnEquity, 0, 0.25),
        scoreLower(m.debtToEquity, 30, 250),   // Yahoo reports this as a percentage
      ]) },
    { label: 'Dividends', naText: 'No dividend paid', score: !m.dividendYield ? null : avgScores([
        scoreHigher(m.dividendYield, 0, 0.04),
        payoutScore,
        scoreHigher(m.fiveYearAvgDividendYield, 0, 4),  // reported in percent
      ]) },
    { label: 'Financials', score: avgScores([
        scoreHigher(m.currentRatio, 0.5, 2.5),
        scoreHigher(m.quickRatio, 0.3, 1.5),
        (m.totalCash != null && m.totalDebt) ? scoreHigher(m.totalCash / m.totalDebt, 0, 1.5) : null,
        scoreHigher(m.revenueGrowth, -0.05, 0.2),
      ]) },
    { label: 'Valuation', score: avgScores([
        (m.trailingPE == null || m.trailingPE <= 0) ? 15 : scoreLower(m.trailingPE, 12, 45),
        (m.forwardPE == null || m.forwardPE <= 0) ? 15 : scoreLower(m.forwardPE, 12, 40),
        scoreLower(m.pegRatio, 1, 3),
        scoreLower(m.priceToBook, 1.5, 10),
        scoreLower(m.priceToSales, 1.5, 12),
      ]) },
    { label: 'Profitability', score: avgScores([
        scoreHigher(m.profitMargins, 0, 0.22),
        scoreHigher(m.operatingMargins, 0, 0.25),
        scoreHigher(m.returnOnAssets, 0, 0.12),
        scoreHigher(m.earningsGrowth, -0.1, 0.25),
      ]) },
  ];
}

function healthColor(s) { return s >= 70 ? 'var(--up)' : s >= 40 ? 'var(--market)' : 'var(--down)'; }
function healthVerdict(s) { return s >= 70 ? 'Excellent' : s >= 40 ? 'Moderate' : 'Stay Away'; }

function toggleHealth(ticker) {
  healthOpen.has(ticker) ? healthOpen.delete(ticker) : healthOpen.add(ticker);
  renderContent();
}

// ═══════════════════════════════════════════════════════════
//  INTRINSIC VALUE ESTIMATE
//  Transparent formula — average of two anchors:
//  (1) analyst consensus mean price target
//  (2) earnings power: forward EPS × growth-adjusted fair multiple,
//      fairPE = 12 + 0.7 × growth% (clamped to 10–28×)
//  Labeled in the UI as a simplified estimate, not a valuation opinion.
// ═══════════════════════════════════════════════════════════
function computeIntrinsic(fund, price) {
  if (!fund) return null;
  const anchors = [];
  if (fund.targetMean > 0) {
    anchors.push({ label: `Analyst consensus target (${fund.analysts || '?'} analysts)`, value: fund.targetMean });
  }
  if (fund.forwardEps > 0) {
    const gPct = Math.max(0, Math.min(0.25, fund.earningsGrowth ?? 0)) * 100;
    const fairPE = Math.min(28, Math.max(10, 12 + 0.7 * gPct));
    anchors.push({ label: `Earnings power: fwd EPS $${fund.forwardEps.toFixed(2)} × ${fairPE.toFixed(0)}× growth-adjusted multiple`, value: fund.forwardEps * fairPE });
  }
  if (!anchors.length || !price) return null;
  const value = anchors.reduce((a, x) => a + x.value, 0) / anchors.length;
  const premPct = (price / value - 1) * 100;  // positive = trading at a premium
  return { value, premPct, anchors };
}

// ═══════════════════════════════════════════════════════════
//  MEAN REVERSION — 2-year historical context for today's move
// ═══════════════════════════════════════════════════════════
let mrCache = {};   // ticker -> { closes: [...] } | 'loading' | 'failed'
let autopsyOpen = new Set();

async function fetchMeanReversionHistory(ticker) {
  const yfUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?range=2y&interval=1d`;
  const json = await proxyFetch(yfUrl);
  const r = json?.chart?.result?.[0];
  const ts = r?.timestamp || [];
  const closes = (r?.indicators?.adjclose?.[0]?.adjclose || r?.indicators?.quote?.[0]?.close || [])
    .filter((c, i) => c != null && c > 0 && ts[i] != null);
  return closes.length > 100 ? { closes } : null;
}

function meanReversionStats(closes, todayChangePct) {
  const FWD = 20;
  const rets = [];
  for (let i = 1; i < closes.length; i++) rets.push((closes[i] / closes[i - 1] - 1) * 100);
  const absToday = Math.abs(todayChangePct);
  const total = rets.length;
  // Days at least as extreme as today, where a 20-day forward window exists
  const fwd = [];
  let matchCount = 0;
  for (let i = 0; i < rets.length; i++) {
    if (Math.abs(rets[i]) >= absToday) {
      matchCount++;
      const p0 = closes[i + 1], p1 = closes[i + 1 + FWD];
      if (p0 && p1) fwd.push((p1 / p0 - 1) * 100);
    }
  }
  const rarityPct = matchCount / total * 100;
  const avgFwd = fwd.length ? fwd.reduce((a, b) => a + b, 0) / fwd.length : null;
  // Confidence grows with sample size; capped and labeled heuristic
  const confidence = fwd.length ? Math.min(90, 25 + fwd.length * 3) : null;
  return { total, matchCount, rarityPct, avgFwd, n: fwd.length, confidence, fwdDays: FWD };
}

function toggleAutopsy(ticker) {
  if (autopsyOpen.has(ticker)) {
    autopsyOpen.delete(ticker);
    renderContent();
    return;
  }
  autopsyOpen.add(ticker);
  renderContent();
  if (!mrCache[ticker]) {
    mrCache[ticker] = 'loading';
    fetchMeanReversionHistory(ticker)
      .then(h => { mrCache[ticker] = h || 'failed'; renderContent(); })
      .catch(() => { mrCache[ticker] = 'failed'; renderContent(); });
  }
}

function buildAutopsyHtml(stock, r) {
  const { data, attr, change, fund, headlines } = r;
  const t = stock.ticker;
  const sign = v => (v >= 0 ? '+' : '') + v.toFixed(2);
  let html = `<div class="autopsy">`;

  // ── Decomposition in percentage points
  if (attr) {
    html += `
      <div class="ap-head">${escHtml(t)} ${sign(attr.stockReturn)}% today — where it came from</div>
      <div class="ap-row"><span class="ap-dot" style="background:var(--market)"></span><span class="ap-src">S&amp;P 500 market move (β ${attr.βM})</span><span class="ap-val ${attr.mComp >= 0 ? 'pos' : 'neg'}">${sign(attr.mComp)}pp</span><span class="ap-share">${attr.mPct.toFixed(0)}%</span></div>
      <div class="ap-row"><span class="ap-dot" style="background:var(--industry)"></span><span class="ap-src">${escHtml(stock.sector)} sector, beyond market (β ${attr.βI})</span><span class="ap-val ${attr.iComp >= 0 ? 'pos' : 'neg'}">${sign(attr.iComp)}pp</span><span class="ap-share">${attr.iPct.toFixed(0)}%</span></div>
      <div class="ap-row"><span class="ap-dot" style="background:var(--company)"></span><span class="ap-src">Company-specific residual</span><span class="ap-val ${attr.cComp >= 0 ? 'pos' : 'neg'}">${sign(attr.cComp)}pp</span><span class="ap-share">${attr.cPct.toFixed(0)}%</span></div>
      <div class="ap-conf">Model fit R² <b>${attr.r2}%</b> over ${attr.windowDays} trading days &nbsp;·&nbsp; Decomposition confidence <b style="color:${attr.confidence >= 65 ? 'var(--up)' : attr.confidence >= 35 ? 'var(--market)' : 'var(--down)'}">${attr.confidence}%</b>
        <span class="ap-info" title="Confidence combines how well the market+sector model historically explains this stock (R²) with how large today's move is relative to its normal daily noise. Small moves are hard to attribute reliably.">ⓘ</span></div>`;
  }

  // ── Evidence: today's actual headlines
  if (headlines && headlines.length) {
    html += `<div class="ap-sec">Possible company-specific drivers — today's headlines</div><ul class="ap-list">` +
      headlines.slice(0, 4).map(h => `<li>${escHtml(h)}</li>`).join('') + `</ul>`;
  }

  // ── Expectations vs reality (real consensus data)
  if (fund?.earnHistory?.length) {
    html += `<div class="ap-sec">Earnings: expectations vs reality (consensus EPS)</div>
      <table class="ap-table"><tr><th>Quarter</th><th>Expected</th><th>Actual</th><th>Surprise</th></tr>` +
      fund.earnHistory.map(q => {
        const beat = q.surprise >= 0;
        return `<tr><td>${escHtml(q.quarter)}</td><td>$${q.est.toFixed(2)}</td><td>$${q.actual.toFixed(2)}</td><td class="${beat ? 'pos' : 'neg'}">${beat ? '+' : ''}${(q.surprise * 100).toFixed(1)}%</td></tr>`;
      }).join('') + `</table>`;
  }

  // ── Ownership & positioning (latest reported — real, dated figures)
  if (fund?.own) {
    const o = fund.own;
    const bar = (v, max) => `<div class="ap-bar-bg"><div class="ap-bar-fill" style="width:${Math.min(100, v / max * 100).toFixed(0)}%"></div></div>`;
    const shortTrend = (o.sharesShort != null && o.sharesShortPrior != null)
      ? (o.sharesShort > o.sharesShortPrior ? ' ▲ rising' : o.sharesShort < o.sharesShortPrior ? ' ▼ falling' : ' flat') : '';
    const asOf = o.shortDate ? new Date(o.shortDate * 1000).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    html += `<div class="ap-sec">Ownership &amp; positioning (latest reported)</div>`;
    if (o.instPct != null) html += `<div class="ap-own"><span>Institutional ownership</span>${bar(o.instPct * 100, 100)}<b>${(o.instPct * 100).toFixed(0)}%</b></div>`;
    if (o.insiderPct != null) html += `<div class="ap-own"><span>Insider ownership</span>${bar(o.insiderPct * 100, 100)}<b>${(o.insiderPct * 100).toFixed(1)}%</b></div>`;
    if (o.shortPctFloat != null) html += `<div class="ap-own"><span>Short interest (% of float${asOf ? ', ' + asOf : ''})</span>${bar(o.shortPctFloat * 100, 20)}<b>${(o.shortPctFloat * 100).toFixed(1)}%${shortTrend}</b></div>`;
    if (o.shortRatio != null) html += `<div class="ap-own"><span>Days-to-cover (short ratio)</span>${bar(o.shortRatio, 10)}<b>${o.shortRatio.toFixed(1)}d</b></div>`;
    if (o.beta != null) html += `<div class="ap-own"><span>Beta (5y monthly)</span>${bar(o.beta, 3)}<b>${o.beta.toFixed(2)}</b></div>`;
  }

  // ── Mean reversion: 2-year historical context
  html += `<div class="ap-sec">Historical context — how unusual is today?</div>`;
  const mr = mrCache[t];
  if (mr === 'loading' || !mr) {
    html += `<div class="ap-mr"><div class="spinner"></div> Loading 2 years of history…</div>`;
  } else if (mr === 'failed') {
    html += `<div class="ap-mr">Could not load 2-year history.</div>`;
  } else if (change != null) {
    const s = meanReversionStats(mr.closes, change);
    if (s.matchCount === 0) {
      html += `<div class="ap-mr">Today's ${Math.abs(change).toFixed(1)}% move is the largest daily move in the past 2 years (${s.total} trading days).</div>`;
    } else {
      html += `<div class="ap-mr">Moves of ≥${Math.abs(change).toFixed(1)}% occurred on <b>${s.rarityPct.toFixed(1)}%</b> of the last ${s.total} trading days (${s.matchCount} days).` +
        (s.avgFwd != null
          ? ` After such days, the average ${s.fwdDays}-day forward return was <b class="${s.avgFwd >= 0 ? 'pos' : 'neg'}">${s.avgFwd >= 0 ? '+' : ''}${s.avgFwd.toFixed(1)}%</b> (n=${s.n}, heuristic confidence ${s.confidence}%).`
          : '') + `</div>`;
    }
  }

  html += `<p class="help" style="margin-top:8px">Decomposition from a 2-factor regression (S&amp;P 500 + sector ETF). Ownership/short data as last reported to the SEC/FINRA via Yahoo Finance. Historical patterns do not predict future results. Not investment advice.</p></div>`;
  return html;
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function proxyFetch(url, asText) {
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(url));
      if (!res.ok) continue;
      return asText ? await res.text() : await res.json();
    } catch {}
  }
  return null;
}

async function fetchNewsRaw(query, count) {
  const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=0&newsCount=${count}&enableFuzzyQuery=false`;
  const json = await proxyFetch(url);
  return json?.news || [];
}

async function fetchTopStories() {
  // Pool headlines from the three major index feeds; a story carried by more
  // feeds (or syndicated under near-identical titles) ranks as "most reported".
  const feeds = await Promise.all(['^GSPC', '^DJI', '^IXIC'].map(q => fetchNewsRaw(q, 10)));
  const seen = new Map();
  feeds.forEach((feed, fi) => feed.forEach(n => {
    if (!n.title) return;
    const key = n.uuid || n.title;
    if (!seen.has(key)) seen.set(key, { n, feeds: new Set() });
    seen.get(key).feeds.add(fi);
  }));

  const norm = t => new Set(t.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(w => w.length > 3));
  const overlap = (a, b) => {
    let inter = 0;
    a.forEach(w => { if (b.has(w)) inter++; });
    return inter / (Math.min(a.size, b.size) || 1);
  };

  const clusters = [];
  for (const { n, feeds: f } of seen.values()) {
    const words = norm(n.title);
    const cl = clusters.find(c => overlap(c.words, words) >= 0.6);
    if (cl) {
      cl.count += f.size;
      if ((n.providerPublishTime || 0) > (cl.n.providerPublishTime || 0)) cl.n = n;
    } else {
      clusters.push({ n, words, count: f.size });
    }
  }
  clusters.sort((a, b) => b.count - a.count || (b.n.providerPublishTime || 0) - (a.n.providerPublishTime || 0));
  return clusters.slice(0, 3).map(c => c.n);
}

function timeAgo(ts) {
  if (!ts) return '';
  const m = Math.max(1, Math.round((Date.now() / 1000 - ts) / 60));
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

async function refreshTopStories() {
  const el = document.getElementById('top-stories');
  if (!el) return;
  const stories = await fetchTopStories();
  if (!stories.length) {
    el.innerHTML = '<p class="help">No market stories available right now.</p>';
    return;
  }
  el.innerHTML = stories.map((n, i) => {
    const link = (n.link || '').startsWith('http') ? n.link : '#';
    return `
    <div class="story-row">
      <span class="story-rank">${i + 1}</span>
      <div style="min-width:0">
        <a class="story-title" href="${escHtml(link)}" target="_blank" rel="noopener">${escHtml(n.title)}</a>
        <div class="story-meta">${escHtml(n.publisher || '')} · ${timeAgo(n.providerPublishTime)}</div>
      </div>
    </div>`;
  }).join('');
}

const BRK_CIK = '1067983';

function parse13F(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const pos = {}; // cusip -> { name, shares, value }
  for (const el of doc.getElementsByTagName('*')) {
    if (el.localName !== 'infoTable') continue;
    let name = '', cusip = '', shares = 0, value = 0;
    for (const c of el.getElementsByTagName('*')) {
      if (c.localName === 'nameOfIssuer') name = c.textContent.trim();
      else if (c.localName === 'cusip') cusip = c.textContent.trim();
      else if (c.localName === 'sshPrnamt') shares += parseFloat(c.textContent) || 0;
      else if (c.localName === 'value') value += parseFloat(c.textContent) || 0;
    }
    if (!cusip) continue;
    if (!pos[cusip]) pos[cusip] = { name, shares: 0, value: 0 };
    pos[cusip].shares += shares;
    pos[cusip].value += value;
  }
  return pos;
}

function quarterLabel(dateStr) {
  const [y, m] = (dateStr || '').split('-').map(Number);
  return y ? 'Q' + Math.ceil(m / 3) + ' ' + y : '';
}

async function fetchBrkMoves() {
  // 1. Find Berkshire's two most recent 13F-HR filings (data.sec.gov allows CORS)
  const subUrl = `https://data.sec.gov/submissions/CIK${BRK_CIK.padStart(10, '0')}.json`;
  let sub = null;
  try {
    const r = await fetch(subUrl);
    if (r.ok) sub = await r.json();
  } catch {}
  if (!sub) sub = await proxyFetch(subUrl);
  const rec = sub?.filings?.recent;
  if (!rec) return null;

  const filings = [];
  for (let i = 0; i < rec.form.length && filings.length < 2; i++) {
    if (rec.form[i] === '13F-HR') {
      filings.push({ acc: rec.accessionNumber[i].replace(/-/g, ''), rpt: rec.reportDate[i] });
    }
  }
  if (filings.length < 2) return null;

  // 2. For each filing, locate and parse the holdings table XML
  const tables = await Promise.all(filings.map(async f => {
    const idx = await proxyFetch(`https://www.sec.gov/Archives/edgar/data/${BRK_CIK}/${f.acc}/index.json`);
    const files = idx?.directory?.item || [];
    const info = files.find(it => it.name.endsWith('.xml') && it.name !== 'primary_doc.xml');
    if (!info) return null;
    const xml = await proxyFetch(`https://www.sec.gov/Archives/edgar/data/${BRK_CIK}/${f.acc}/${info.name}`, true);
    return xml ? parse13F(xml) : null;
  }));
  if (!tables[0] || !tables[1]) return null;

  // 3. Diff positions by CUSIP (issuer names vary between quarters; CUSIPs don't)
  const [latest, prior] = tables;
  const changes = [];
  for (const cusip of new Set([...Object.keys(latest), ...Object.keys(prior)])) {
    const n = latest[cusip] || { shares: 0, value: 0 };
    const o = prior[cusip] || { shares: 0, value: 0 };
    const d = n.shares - o.shares;
    if (!d) continue;
    const ref = n.shares ? n : o;
    const px = ref.shares ? ref.value / ref.shares : 0;
    changes.push({
      name: (latest[cusip] || prior[cusip]).name,
      kind: !o.shares ? 'NEW BUY' : !n.shares ? 'SOLD ALL' : d > 0 ? 'ADDED' : 'TRIMMED',
      dollars: Math.abs(d) * px,
      buy: d > 0,
    });
  }
  changes.sort((a, b) => b.dollars - a.dollars);
  return { changes: changes.slice(0, 6), newQ: filings[0].rpt, oldQ: filings[1].rpt };
}

async function refreshBrkMoves() {
  const el = document.getElementById('brk-moves');
  if (!el) return;
  const data = await fetchBrkMoves();
  if (!data || !data.changes.length) {
    el.innerHTML = '<p class="help">Could not load Berkshire 13F data from SEC EDGAR.</p>';
    return;
  }
  const fmt$ = v => v >= 1e9 ? '$' + (v / 1e9).toFixed(1) + 'B' : v >= 1e6 ? '$' + (v / 1e6).toFixed(0) + 'M' : '$' + (v / 1e3).toFixed(0) + 'K';
  const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  el.innerHTML = data.changes.map(c => `
    <div class="brk-row">
      <span class="brk-badge ${c.buy ? 'badge-buy' : 'badge-sell'}">${c.kind}</span>
      <span class="brk-name" title="${escHtml(titleCase(c.name))}">${escHtml(titleCase(c.name))}</span>
      <span class="brk-amt ${c.buy ? 'pos' : 'neg'}">${c.buy ? '+' : '−'}${fmt$(c.dollars)}</span>
    </div>`).join('') +
    `<p class="help" style="margin-top:8px">${quarterLabel(data.oldQ)} → ${quarterLabel(data.newQ)}, from Berkshire's latest quarterly 13F filing (SEC allows up to a 45-day reporting lag). Dollar values estimated at filing-period prices.</p>`;
}

// ═══════════════════════════════════════════════════════════
//  MATH — ATTRIBUTION MODEL
// ═══════════════════════════════════════════════════════════
function alignByDate(a, b, c) {
  const mb = new Map(b.map(d => [d.date.toDateString(), d.close]));
  const mc = new Map(c.map(d => [d.date.toDateString(), d.close]));
  const aligned = a
    .filter(d => mb.has(d.date.toDateString()) && mc.has(d.date.toDateString()))
    .map(d => ({
      s: d.close,
      m: mb.get(d.date.toDateString()),
      i: mc.get(d.date.toDateString())
    }));
  return aligned;
}

function returns(aligned) {
  const out = [];
  for (let i = 1; i < aligned.length; i++) {
    out.push({
      s: (aligned[i].s - aligned[i-1].s) / aligned[i-1].s,
      m: (aligned[i].m - aligned[i-1].m) / aligned[i-1].m,
      i: (aligned[i].i - aligned[i-1].i) / aligned[i-1].i
    });
  }
  return out;
}

function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
function betaOf(x, y) {
  const mx = mean(x), my = mean(y);
  const cov = x.reduce((s, xi, k) => s + (xi - mx) * (y[k] - my), 0);
  const vx = x.reduce((s, xi) => s + (xi - mx) ** 2, 0);
  return vx === 0 ? 0 : cov / vx;
}

function attribute(stockData, mktData, secData) {
  const aligned = alignByDate(stockData.prices, mktData.prices, secData.prices);
  if (aligned.length < 10) return null;

  const window = Math.min(aligned.length - 1, REGRESSION_WINDOW);
  const rets = returns(aligned);
  const slice = rets.slice(-window);

  const sR = slice.map(d => d.s);
  const mR = slice.map(d => d.m);
  const iR = slice.map(d => d.i);

  // Stage 1: market beta
  const βM = betaOf(mR, sR);

  // Stage 2: sector beta on sector excess (removes market from sector)
  const secExcess = iR.map((r, k) => r - mR[k]);
  const sResid = sR.map((r, k) => r - βM * mR[k]);
  const βI = betaOf(secExcess, sResid);

  // Latest day decomposition
  const latest = rets[rets.length - 1];
  const latestSecExcess = latest.i - latest.m;

  const mComp = βM * latest.m;
  const iComp = βI * latestSecExcess;
  const cComp = latest.s - mComp - iComp;

  const absSum = Math.abs(mComp) + Math.abs(iComp) + Math.abs(cComp);
  const safe = absSum > 0.0001;

  const mPct = safe ? Math.abs(mComp) / absSum * 100 : 33.3;
  const iPct = safe ? Math.abs(iComp) / absSum * 100 : 33.3;
  const cPct = safe ? Math.abs(cComp) / absSum * 100 : 33.3;

  // Recovery probability (weighted by attribution share)
  const recoveryProb = (mPct/100 * RECOVERY_RATES.market +
                        iPct/100 * RECOVERY_RATES.industry +
                        cPct/100 * RECOVERY_RATES.company) * 100;

  // Opportunity score: magnitude × weighted recovery likelihood
  const magnitude = Math.abs(latest.s * 100);
  const opportunityScore = Math.min(100, magnitude *
    (mPct/100 * OPP_WEIGHTS.market + iPct/100 * OPP_WEIGHTS.industry + cPct/100 * OPP_WEIGHTS.company) * 10);

  // Model fit: how much of this stock's daily variance the two-factor
  // model historically explains (R²), plus residual noise level.
  const pred = slice.map((d, k) => βM * mR[k] + βI * secExcess[k]);
  const meanS = sR.reduce((a, b) => a + b, 0) / sR.length;
  const ssTot = sR.reduce((a, r) => a + (r - meanS) ** 2, 0);
  const ssRes = sR.reduce((a, r, k) => a + (r - pred[k]) ** 2, 0);
  const r2 = ssTot > 0 ? Math.max(0, 1 - ssRes / ssTot) : 0;
  const sigmaStock = Math.sqrt(ssTot / Math.max(1, sR.length - 1));

  // Decomposition confidence: high model fit AND a move large enough to
  // stand out from daily noise. Heuristic, shown to the user as such.
  const signalStrength = 1 - Math.exp(-Math.abs(latest.s) / (sigmaStock || 0.0001));
  const confidence = Math.max(5, Math.min(97, 100 * Math.sqrt(r2) * signalStrength));

  return {
    stockReturn: latest.s * 100,
    mComp: mComp * 100,
    iComp: iComp * 100,
    cComp: cComp * 100,
    mPct, iPct, cPct,
    βM: +βM.toFixed(2), βI: +βI.toFixed(2),
    r2: +(r2 * 100).toFixed(0),
    confidence: +confidence.toFixed(0),
    windowDays: window,
    recoveryProb: +recoveryProb.toFixed(1),
    opportunityScore: +opportunityScore.toFixed(1)
  };
}

const EVENT_PATTERNS = [
  { label: 'Earnings Report',         color: '#6366f1', keys: ['earnings','eps','revenue','guidance','quarterly','beat','miss','profit','loss','q1','q2','q3','q4'] },
  { label: 'M&A Activity',            color: '#ec4899', keys: ['merger','acquisition','acquir','buyout','takeover','deal','bid','acquire'] },
  { label: 'Regulatory / FDA',        color: '#f97316', keys: ['fda','regulatory','approved','approval','recall','investigation','sec ','lawsuit','settlement'] },
  { label: 'Management Change',       color: '#a78bfa', keys: ['ceo','cfo','executive','resign','appoint','restructur','layoff','workforce'] },
  { label: 'Macroeconomic Event',     color: '#22d3ee', keys: ['fed ','federal reserve','interest rate','inflation','recession','tariff','trade war','gdp'] },
  { label: 'Product / Competition',   color: '#84cc16', keys: ['product','launch','competi','market share','partnership','contract','wins','loses'] },
];

function classifyEvent(headlines) {
  if (!headlines || headlines.length === 0) return null;
  const text = headlines.join(' ').toLowerCase();
  const scores = EVENT_PATTERNS.map(p => ({
    ...p,
    score: p.keys.filter(k => text.includes(k)).length
  }));
  scores.sort((a, b) => b.score - a.score);
  return scores[0].score > 0 ? scores[0] : null;
}

// ═══════════════════════════════════════════════════════════
function recoveryLabel(prob) {
  if (prob >= 65) return { text: 'HIGH', color: 'var(--high)' };
  if (prob >= 45) return { text: 'MODERATE', color: 'var(--moderate)' };
  return { text: 'LOW', color: 'var(--low)' };
}

function opportunityColor(score) {
  if (score >= 65) return 'var(--high)';
  if (score >= 35) return 'var(--moderate)';
  return 'var(--muted)';
}

function buildNarrative(ticker, attr, event) {
  const { stockReturn, mPct, iPct, cPct, recoveryProb, opportunityScore } = attr;
  const dir = stockReturn < 0 ? 'declined' : 'gained';
  const abs = Math.abs(stockReturn).toFixed(1);
  const macroShare = (mPct + iPct).toFixed(0);
  const rl = recoveryLabel(recoveryProb);
  let eventNote = '';
  if (event) eventNote = ` Recent headlines suggest a <strong>${event.label}</strong> may be a contributing factor.`;
  return `<strong>${ticker}</strong> has ${dir} <strong>${abs}%</strong>. Analysis attributes <strong>${macroShare}%</strong> of the move to market and sector forces versus <strong>${cPct.toFixed(0)}%</strong> to company-specific factors.${eventNote} Historical recovery probability: <strong style="color:${rl.color}">${recoveryProb}%</strong>.`;
}

async function fetchScreener(scrId) {
  const yfUrl = `https://query2.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds=${scrId}&count=8&start=0`;
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(yfUrl));
      if (!res.ok) continue;
      const json = await res.json();
      const quotes = (json?.finance?.result?.[0]?.quotes || [])
        .map(q => ({ symbol: q.symbol, name: q.shortName || q.symbol, price: q.regularMarketPrice, change: q.regularMarketChangePercent }))
        .filter(q => q.price != null && q.change != null);
      if (quotes.length) return quotes;
    } catch {}
  }
  return [];
}

async function fetchMoversFromUniverse() {
  const quotes = (await Promise.all(MOVER_UNIVERSE.map(fetchQuoteSingle))).filter(Boolean).filter(q => q.change != null);
  quotes.sort((a, b) => b.change - a.change);
  return { gainers: quotes.slice(0, 7), losers: quotes.slice(-7).reverse() };
}

async function fetchQuoteSingle(symbol) {
  const yfUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=5d&interval=1d`;
  for (const proxyFn of PROXY_FNS) {
    try {
      const res = await fetch(proxyFn(yfUrl));
      if (!res.ok) continue;
      const json = await res.json();
      const m = json?.chart?.result?.[0]?.meta;
      if (!m?.regularMarketPrice) continue;
      const price = m.regularMarketPrice;
      const prev = m.chartPreviousClose;
      const change = prev ? (price - prev) / prev * 100 : null;
      return { symbol, name: m.shortName || m.longName || symbol, price, change };
    } catch {}
  }
  return null;
}

async function fetchQuotes(symbols) {
  const results = await Promise.all(symbols.map(fetchQuoteSingle));
  return results.filter(Boolean).filter(q => q.change != null);
}

async function fetchInsiderFilings() {
  // Parse EDGAR Form 4 RSS and return list of {cik, accNoDash} objects (no network calls per filing)
  const rssUrl = 'https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=4&dateb=&owner=include&count=40&search_text=&output=atom';
  let rssText = null;
  try { const r = await fetch(rssUrl); if (r.ok) rssText = await r.text(); } catch {}
  if (!rssText) {
    for (const fn of PROXY_FNS) {
      try { const r = await fetch(fn(rssUrl)); if (r.ok) { rssText = await r.text(); break; } } catch {}
    }
  }
  if (!rssText) return [];

  const feedXml = new DOMParser().parseFromString(rssText, 'application/xml');
  const entries = Array.from(feedXml.querySelectorAll('entry'));
  const seen = new Set(), filings = [];

  for (const entry of entries) {
    const title = entry.querySelector('title')?.textContent?.trim() || '';
    const link  = entry.querySelector('link')?.getAttribute('href') || '';
    const idEl  = entry.querySelector('id')?.textContent?.trim() || '';
    if (!title.toLowerCase().includes('(reporting)')) continue;
    const accession = idEl.match(/accession-number=([0-9\-]+)/)?.[1]?.trim();
    if (!accession || seen.has(accession)) continue;
    seen.add(accession);
    const cik = link.match(/\/Archives\/edgar\/data\/(\d+)\//)?.[1];
    if (!cik) continue;
    filings.push({ cik, accNoDash: accession.replace(/-/g, '') });
    if (filings.length >= 10) break;
  }
  return filings;
}

async function fetchOneInsiderTrade({ cik, accNoDash }) {
  try {
    // Step 1: get exact XML filename from data.sec.gov/submissions (direct — has CORS *)
    const accDash = accNoDash.replace(/^(\d{10})(\d{2})(\d{6})$/, '$1-$2-$3');
    let primaryDoc = 'ownership.xml';
    try {
      const subUrl = `https://data.sec.gov/submissions/CIK${cik.padStart(10,'0')}.json`;
      const r = await fetch(subUrl);
      if (r.ok) {
        const sub = await r.json();
        const idx = (sub.filings?.recent?.accessionNumber || []).indexOf(accDash);
        if (idx >= 0) primaryDoc = (sub.filings.recent.primaryDocument[idx] || primaryDoc).replace(/^xsl\w+\//, '');
      }
    } catch {}

    // Step 2: fetch the XML via proxy (one call with the correct filename)
    const xmlUrl = `https://www.sec.gov/Archives/edgar/data/${cik}/${accNoDash}/${primaryDoc}`;
    let xmlText = null;
    for (const fn of PROXY_FNS) {
      try { const r = await fetch(fn(xmlUrl)); if (r.ok) { xmlText = await r.text(); break; } } catch {}
    }
    if (!xmlText) return null;

    const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const issuerName = doc.querySelector('issuerName')?.textContent?.trim() || '';
    const ticker     = doc.querySelector('issuerTradingSymbol')?.textContent?.trim() || '';
    const ownerName  = doc.querySelector('rptOwnerName')?.textContent?.trim() || '';
    const role       = doc.querySelector('officerTitle')?.textContent?.trim() || '';

    let buy = 0, sell = 0;
    for (const txn of doc.querySelectorAll('nonDerivativeTransaction')) {
      const shares = parseFloat(txn.querySelector('transactionShares value')?.textContent || '0');
      const price  = parseFloat(txn.querySelector('transactionPricePerShare value')?.textContent || '0');
      const code   = txn.querySelector('transactionAcquiredDisposedCode value')?.textContent?.trim();
      if (code === 'A') buy  += shares * price;
      if (code === 'D') sell += shares * price;
    }
    const isBuy = buy >= sell;
    const amount = isBuy ? buy : sell;
    if (amount < 10000) return null;
    return { insider: ownerName, company: issuerName, ticker, role, type: isBuy ? 'BUY' : 'SELL', amount };
  } catch { return null; }
}

// ═══════════════════════════════════════════════════════════
//  BACKGROUND STRESS TEST — cross-verify vs Nasdaq.com API
// ═══════════════════════════════════════════════════════════
async function runStressTest() {
  const toVerify = trackedStocks
    .map(s => ({ ticker: s.ticker, yfPrice: results[s.ticker]?.data?.currentPrice }))
    .filter(s => s.yfPrice);

  if (!toVerify.length) return;

  const verifyLog = JSON.parse(localStorage.getItem('smt_verify') || '[]');
  const run = { timestamp: new Date().toISOString(), checks: [] };

  for (const { ticker, yfPrice } of toVerify) {
    try {
      // Nasdaq.com public quote API — official exchange data, no key required
      const nasdaqUrl = `https://api.nasdaq.com/api/quote/${ticker}/info?assetclass=stocks`;
      let json = null;
      for (const fn of PROXY_FNS) {
        try {
          const r = await fetch(fn(nasdaqUrl));
          if (r.ok) { json = await r.json(); break; }
        } catch {}
      }
      if (!json) { run.checks.push({ ticker, result: 'NASDAQ_UNAVAILABLE' }); continue; }

      const priceStr = json?.data?.primaryData?.lastSalePrice?.replace(/[$,]/g, '') || '';
      const nasdaqPrice = parseFloat(priceStr);
      if (isNaN(nasdaqPrice)) { run.checks.push({ ticker, result: 'PARSE_ERROR' }); continue; }

      const diff = Math.abs(yfPrice - nasdaqPrice) / nasdaqPrice * 100;
      const passed = diff <= 1.0; // allow ≤1% difference (bid/ask spread, timestamps)

      run.checks.push({ ticker, yfPrice: +yfPrice.toFixed(2), nasdaqPrice: +nasdaqPrice.toFixed(2), diffPct: +diff.toFixed(3), passed });
      if (passed) {
        console.log(`%c[Verify ✓] ${ticker}  YF $${yfPrice.toFixed(2)}  NASDAQ $${nasdaqPrice.toFixed(2)}  Δ${diff.toFixed(3)}%`, 'color:#10b981');
      } else {
        console.warn(`[Verify ⚠] ${ticker}  YF $${yfPrice.toFixed(2)}  NASDAQ $${nasdaqPrice.toFixed(2)}  Δ${diff.toFixed(3)}%  — discrepancy exceeds 1%`);
      }
    } catch (e) {
      run.checks.push({ ticker, result: 'ERROR', error: e.message });
      console.log(`[Verify] ${ticker}: ${e.message}`);
    }
  }

  const passed = run.checks.filter(c => c.passed).length;
  const total  = run.checks.filter(c => c.passed != null).length;
  console.log(`%c[Verify] Run complete — ${passed}/${total} passed. Full log: localStorage.getItem('smt_verify')`, 'color:#3b82f6;font-weight:bold');

  verifyLog.unshift(run);
  localStorage.setItem('smt_verify', JSON.stringify(verifyLog.slice(0, 50)));
}

async function refreshTicker() {
  // Fetch each feed independently so one failure doesn't block the others

  // 0. Magnificent 7
  (async () => {
    const quotes = await fetchQuotes(MAG7);
    quotes.sort((a, b) => b.change - a.change);
    tickerCache.mag7 = quotes;
    if (activeTicker === 'mag7') renderTickerContent();
  })();

  // 1. Movers — try screener first, fall back to fixed universe
  (async () => {
    let gainers = await fetchScreener('day_gainers');
    let losers  = await fetchScreener('day_losers');
    if (!gainers.length && !losers.length) {
      ({ gainers, losers } = await fetchMoversFromUniverse());
    }
    tickerCache.movers = { gainers, losers };
    if (activeTicker === 'movers') renderTickerContent();
  })();

  // 2. Industries — all 11 sector ETFs
  (async () => {
    const sectors = await fetchQuotes(Object.keys(SECTOR_MAP));
    const named = sectors.map(q => ({ ...q, name: SECTOR_MAP[q.symbol] || q.symbol }));
    named.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
    tickerCache.industries = named;
    if (activeTicker === 'industries') renderTickerContent();
  })();

  // 3. Berkshire holdings
  (async () => {
    const brkQuotes = await fetchQuotes(BRK_HOLDINGS.map(h => h.symbol));
    const weighted = brkQuotes.map(q => {
      const h = BRK_HOLDINGS.find(h => h.symbol === q.symbol);
      return { ...q, name: h?.name || q.name, weight: h?.weight || 0 };
    }).sort((a, b) => b.weight - a.weight);
    tickerCache.berkshire = weighted;
    if (activeTicker === 'berkshire') renderTickerContent();
  })();

  // 4. Insider trades — stream results in as each filing resolves so the tab populates quickly
  (async () => {
    tickerCache.insiders = [];
    const filings = await fetchInsiderFilings();   // fast: just RSS parse
    if (!filings.length) return;
    filings.map(async f => {
      const trade = await fetchOneInsiderTrade(f);
      if (!trade) return;
      tickerCache.insiders = [...tickerCache.insiders, trade]
        .sort((a, b) => b.amount - a.amount)
        .slice(0, 10);
      if (activeTicker === 'insiders') renderTickerContent();
    });
  })();
}

function itemHtml(q, extra) {
  const sign = q.change >= 0 ? '+' : '';
  const cls = q.change >= 0 ? 'pos' : 'neg';
  return `<div class="ticker-item">
    <span class="ticker-sym">${q.symbol}</span>
    <span class="ticker-name">${q.name}</span>
    <span class="ticker-price">$${q.price?.toFixed(2) ?? '—'}</span>
    <span class="ticker-chg ${cls}">${sign}${q.change?.toFixed(2)}%</span>
    ${extra || ''}
  </div>`;
}

function scrollHtml(inner, itemCount) {
  const duration = Math.max(30, itemCount * 5);
  return `<div class="ticker-scroll" style="animation-duration:${duration}s">${inner}${inner}</div>`;
}

function renderTickerContent() {
  const wrap = document.getElementById('tickerWrap');
  if (!wrap) return;
  const data = tickerCache[activeTicker];
  if (!data) { wrap.innerHTML = '<div class="ticker-loading">Loading…</div>'; return; }

  let inner = '';
  let count = 0;

  if (activeTicker === 'mag7') {
    if (!data.length) { wrap.innerHTML = '<div class="ticker-loading">No Mag 7 data</div>'; return; }
    inner = `<div class="ticker-section neutral">Magnificent 7</div>` + data.map(q => itemHtml(q)).join('');
    count = data.length;

  } else if (activeTicker === 'movers') {
    const { gainers, losers } = data;
    if (!gainers.length && !losers.length) { wrap.innerHTML = '<div class="ticker-loading">No mover data</div>'; return; }
    const gHtml = gainers.length ? `<div class="ticker-section up">▲ Gainers</div>${gainers.map(q => itemHtml(q)).join('')}` : '';
    const lHtml = losers.length  ? `<div class="ticker-section dn">▼ Losers</div>${losers.map(q => itemHtml(q)).join('')}` : '';
    inner = gHtml + lHtml;
    count = gainers.length + losers.length;

  } else if (activeTicker === 'industries') {
    if (!data.length) { wrap.innerHTML = '<div class="ticker-loading">No sector data</div>'; return; }
    const bigUp = data.filter(q => q.change >= 0);
    const bigDn = data.filter(q => q.change < 0);
    const uHtml = bigUp.length ? `<div class="ticker-section up">▲ Leading</div>${bigUp.map(q => itemHtml(q)).join('')}` : '';
    const dHtml = bigDn.length ? `<div class="ticker-section dn">▼ Lagging</div>${bigDn.map(q => itemHtml(q)).join('')}` : '';
    inner = uHtml + dHtml;
    count = data.length;

  } else if (activeTicker === 'berkshire') {
    if (!data.length) { wrap.innerHTML = '<div class="ticker-loading">No Berkshire data</div>'; return; }
    inner = `<div class="ticker-section neutral">BRK Holdings</div>` +
      data.map(q => itemHtml(q, `<span class="ticker-weight">${q.weight}%</span>`)).join('');
    count = data.length;

  } else if (activeTicker === 'insiders') {
    if (!data.length) { wrap.innerHTML = '<div class="ticker-loading">No insider trade data available — SEC filings may be delayed</div>'; return; }
    const fmt = n => n >= 1e9 ? `$${(n/1e9).toFixed(1)}B` : n >= 1e6 ? `$${(n/1e6).toFixed(1)}M` : `$${(n/1e3).toFixed(0)}K`;
    inner = `<div class="ticker-section neutral">SEC Form 4 Insider Trades</div>` +
      data.map(t => `<div class="ticker-item">
        <span class="ticker-sym">${t.ticker || '—'}</span>
        <span class="ticker-name">${t.company.length > 18 ? t.company.slice(0,18)+'…' : t.company}</span>
        <span class="ticker-name" style="color:var(--muted)">${t.insider.split(' ').slice(-1)[0]}</span>
        <span class="ticker-badge badge-${t.type.toLowerCase()}">${t.type}</span>
        <span class="ticker-chg ${t.type==='BUY'?'pos':'neg'}">${fmt(t.amount)}</span>
      </div>`).join('');
    count = data.length;
  }

  wrap.innerHTML = scrollHtml(inner, count);
}

function switchTicker(type) {
  activeTicker = type;
  document.querySelectorAll('.ticker-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + type)?.classList.add('active');

}

async function refreshAll() {
  if (isRefreshing) return;
  isRefreshing = true;
  setRefreshBtn(true);

  try {
    marketCache = await fetchYF(MARKET_TICKER);

    const sectors = [...new Set(trackedStocks.map(s => s.sector).filter(Boolean))];
    await Promise.allSettled(sectors.map(async sec => {
      const etf = SECTOR_ETFS[sec];
      if (etf) {
        try { sectorCache[sec] = await fetchYF(etf); } catch {}
      }
    }));

    await Promise.allSettled(trackedStocks.map(async stock => {
      try {
        const [data, headlines, fund] = await Promise.all([
          fetchYF(stock.ticker),
          fetchNews(stock.ticker),
          fetchFundamentals(stock.ticker)
        ]);

        const sec = sectorCache[stock.sector];
        const attr = (sec && marketCache) ? attribute(data, marketCache, sec) : null;
        const event = classifyEvent(headlines);
        const change = (data.currentPrice && data.previousClose)
          ? (data.currentPrice / data.previousClose - 1) * 100 : null;
        const flagged = change !== null && Math.abs(change) >= stock.threshold;

        results[stock.ticker] = { data, attr, event, change, flagged, fund, headlines, error: null };
      } catch (e) {
        results[stock.ticker] = { error: e.message, flagged: false };
      }
    }));

    renderContent();
    document.getElementById('refreshTime').textContent =
      'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    // Background data verification — results logged to console (DevTools) and localStorage
    setTimeout(runStressTest, 3000);
  } catch (e) {
    renderBanner('banner-error', '❌ ' + e.message);
  }

  isRefreshing = false;
  setRefreshBtn(false);
}
