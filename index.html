// ═══════════════════════════════════════════════════════════
//  PORTFOLIO SUMMARY — equal-weight rollup across tracked stocks
// ═══════════════════════════════════════════════════════════
function renderPortfolioSummary() {
  const rows = trackedStocks
    .map(s => ({ s, r: results[s.ticker] }))
    .filter(x => x.r && !x.r.error && x.r.change != null);
  if (rows.length < 2) return '';

  const avgMove = rows.reduce((a, x) => a + x.r.change, 0) / rows.length;
  const best = rows.reduce((a, x) => x.r.change > a.r.change ? x : a);
  const worst = rows.reduce((a, x) => x.r.change < a.r.change ? x : a);

  // Risk split: each stock's attribution shares, weighted by |today's move|
  const attrRows = rows.filter(x => x.r.attr);
  let riskHtml = '';
  if (attrRows.length) {
    let wSum = 0, m = 0, i = 0, c = 0;
    for (const x of attrRows) {
      const w = Math.max(0.1, Math.abs(x.r.change));
      wSum += w; m += x.r.attr.mPct * w; i += x.r.attr.iPct * w; c += x.r.attr.cPct * w;
    }
    m /= wSum; i /= wSum; c /= wSum;
    riskHtml = `
      <div class="pf-risk">
        <div class="pf-risk-label">Today's risk mix (move-weighted)</div>
        <div class="mini-bar">
          <div class="mini-seg fill-company" style="width:${c.toFixed(1)}%" title="Company-specific ${c.toFixed(0)}%"></div>
          <div class="mini-seg fill-industry" style="width:${i.toFixed(1)}%" title="Sector ${i.toFixed(0)}%"></div>
          <div class="mini-seg fill-market" style="width:${m.toFixed(1)}%" title="Market ${m.toFixed(0)}%"></div>
        </div>
        <div class="mini-legend">
          <span><span class="mini-dot" style="background:var(--company)"></span>${c.toFixed(0)}% company</span>
          <span><span class="mini-dot" style="background:var(--industry)"></span>${i.toFixed(0)}% sector</span>
          <span><span class="mini-dot" style="background:var(--market)"></span>${m.toFixed(0)}% market</span>
        </div>
      </div>`;
  }

  // Most undervalued / most expensive by intrinsic estimate
  const ivRows = rows
    .map(x => ({ ...x, iv: computeIntrinsic(x.r.fund, x.r.data?.currentPrice) }))
    .filter(x => x.iv);
  let ivHtml = '';
  if (ivRows.length) {
    const cheap = ivRows.reduce((a, x) => x.iv.premPct < a.iv.premPct ? x : a);
    const disc = -cheap.iv.premPct;
    ivHtml = `<div class="pf-item"><span class="pf-k">Most undervalued</span><span class="pf-v">${cheap.s.ticker} <span class="${disc >= 0 ? 'pos' : 'neg'}">${Math.abs(disc).toFixed(0)}% ${disc >= 0 ? 'discount' : 'premium'}</span></span></div>`;
  }

  // Highest short interest
  const shortRows = rows.filter(x => x.r.fund?.own?.shortPctFloat != null);
  let shortHtml = '';
  if (shortRows.length) {
    const hi = shortRows.reduce((a, x) => x.r.fund.own.shortPctFloat > a.r.fund.own.shortPctFloat ? x : a);
    shortHtml = `<div class="pf-item"><span class="pf-k">Highest short interest</span><span class="pf-v">${hi.s.ticker} <b>${(hi.r.fund.own.shortPctFloat * 100).toFixed(1)}%</b> of float</span></div>`;
  }

  return `
    <div class="card pf-card">
      <div class="card-heading">Portfolio Summary — ${rows.length} stocks (equal-weight)</div>
      <div class="pf-grid">
        <div class="pf-item"><span class="pf-k">Average move today</span><span class="pf-v ${avgMove >= 0 ? 'pos' : 'neg'}">${avgMove >= 0 ? '+' : ''}${avgMove.toFixed(2)}%</span></div>
        <div class="pf-item"><span class="pf-k">Largest contributor</span><span class="pf-v">${best.s.ticker} <span class="pos">+${best.r.change.toFixed(2)}%</span></span></div>
        <div class="pf-item"><span class="pf-k">Largest drag</span><span class="pf-v">${worst.s.ticker} <span class="neg">${worst.r.change.toFixed(2)}%</span></span></div>
        ${ivHtml}${shortHtml}
      </div>
      ${riskHtml}
    </div>`;
}

function renderCard(stock) {
  const r = results[stock.ticker];

  if (!r) {
    return `<div class="stock-card is-loading">
      <div class="sc-header"><div class="sc-title"><span class="sc-ticker">${stock.ticker}</span></div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted)"><div class="spinner"></div> Loading…</div>
    </div>`;
  }

  if (r.error) {
    return `<div class="stock-card is-error">
      <div class="sc-header">
        <div class="sc-title"><span class="sc-ticker">${stock.ticker}</span></div>
        <button class="sc-remove" onclick="removeStock('${stock.ticker}')">✕</button>
      </div>
      <div class="error-text">⚠️ ${r.error}</div>
    </div>`;
  }

  const { data, attr, event, change, flagged, fund } = r;
  const changeSign = change >= 0 ? '+' : '';
  const changeClass = change >= 0 ? 'pos' : 'neg';
  const eventHtml = event
    ? `<span class="event-tag" style="color:${event.color};border-color:${event.color}33;background:${event.color}10">● ${event.label}</span>`
    : '';

  let attrHtml = '';

  if (attr && flagged) {
    // Full attribution section for flagged stocks
    const rl = recoveryLabel(attr.recoveryProb);
    const narrative = buildNarrative(stock.ticker, attr, event);
    const occScore = attr.opportunityScore;
    const occColor = opportunityColor(occScore);
    const sign = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

    attrHtml = `
      <hr class="divider">
      <div class="attr-label-row">
        <span class="attr-section-title">Movement Attribution</span>
        <span style="font-size:11px;color:var(--muted)">β<sub>M</sub>${attr.βM} &nbsp; β<sub>I</sub>${attr.βI} &nbsp; Conf. <b style="color:${attr.confidence >= 65 ? 'var(--up)' : attr.confidence >= 35 ? 'var(--market)' : 'var(--down)'}">${attr.confidence}%</b></span>
      </div>

      <div class="attr-chart-wrap">
        <canvas id="chart-${stock.ticker}" class="attr-chart-canvas" width="130" height="130"></canvas>
        <div class="attr-summary-text">
          <div class="attr-bars">
            <div class="attr-bar-row">
              <span class="attr-bar-label lbl-market">Market</span>
              <div class="attr-bar-bg"><div class="attr-bar-fill fill-market" style="width:${attr.mPct.toFixed(1)}%"></div></div>
              <span class="attr-bar-pct">${attr.mPct.toFixed(1)}%</span>
              <span class="attr-bar-val ${attr.mComp >= 0 ? 'pos' : 'neg'}">${sign(attr.mComp)}</span>
            </div>
            <div class="attr-bar-row">
              <span class="attr-bar-label lbl-industry">Industry</span>
              <div class="attr-bar-bg"><div class="attr-bar-fill fill-industry" style="width:${attr.iPct.toFixed(1)}%"></div></div>
              <span class="attr-bar-pct">${attr.iPct.toFixed(1)}%</span>
              <span class="attr-bar-val ${attr.iComp >= 0 ? 'pos' : 'neg'}">${sign(attr.iComp)}</span>
            </div>
            <div class="attr-bar-row">
              <span class="attr-bar-label lbl-company">Company</span>
              <div class="attr-bar-bg"><div class="attr-bar-fill fill-company" style="width:${attr.cPct.toFixed(1)}%"></div></div>
              <span class="attr-bar-pct">${attr.cPct.toFixed(1)}%</span>
              <span class="attr-bar-val ${attr.cComp >= 0 ? 'pos' : 'neg'}">${sign(attr.cComp)}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="recovery-box" style="border-color:${rl.color}22;background:${rl.color}08">
        <div class="recovery-top">
          <span class="recovery-title">Recovery Probability</span>
          <span class="recovery-prob" style="color:${rl.color}">${attr.recoveryProb}%</span>
        </div>
        <div class="recovery-level" style="color:${rl.color}">Likelihood: ${rl.text}</div>
        <div class="recovery-reason">
          Market: ${RECOVERY_RATES.market*100}% historical rate &nbsp;·&nbsp;
          Industry: ${RECOVERY_RATES.industry*100}% &nbsp;·&nbsp;
          Company: ${RECOVERY_RATES.company*100}%
        </div>
      </div>

      <div class="opp-score-row" style="margin-bottom:10px">
        <span class="opp-score-label">Opportunity Score</span>
        <div class="opp-score-bar-bg">
          <div class="opp-score-bar-fill" style="width:${occScore}%;background:${occColor}"></div>
        </div>
        <span class="opp-score-val" style="color:${occColor}">${occScore.toFixed(0)}</span>
      </div>

      <div class="narrative">${narrative}</div>
    `;
  } else if (attr) {
    // Mini attribution bar for non-flagged stocks
    attrHtml = `
      <hr class="divider">
      <div class="mini-attr">
        <div style="font-size:11px;color:var(--muted);margin-bottom:3px">Today's attribution</div>
        <div class="mini-bar">
          <div class="mini-seg fill-market" style="width:${attr.mPct.toFixed(1)}%" title="Market ${attr.mPct.toFixed(1)}%"></div>
          <div class="mini-seg fill-industry" style="width:${attr.iPct.toFixed(1)}%" title="Industry ${attr.iPct.toFixed(1)}%"></div>
          <div class="mini-seg fill-company" style="width:${attr.cPct.toFixed(1)}%" title="Company ${attr.cPct.toFixed(1)}%"></div>
        </div>
        <div class="mini-legend">
          <span><span class="mini-dot" style="background:var(--market)"></span>${attr.mPct.toFixed(0)}% mkt</span>
          <span><span class="mini-dot" style="background:var(--industry)"></span>${attr.iPct.toFixed(0)}% ind</span>
          <span><span class="mini-dot" style="background:var(--company)"></span>${attr.cPct.toFixed(0)}% co</span>
          <span style="margin-left:auto">Conf. ${attr.confidence}% · Rec. prob. ${attr.recoveryProb}%</span>
        </div>
      </div>
    `;
  } else {
    attrHtml = `<div style="font-size:11px;color:var(--muted);margin-top:10px">No sector data — attribution unavailable</div>`;
  }

  // Fundamentals strip: P/E ratio + average analyst price target
  let fundHtml = '';
  if (fund && (fund.trailingPE != null || fund.targetMean != null)) {
    const peText = fund.trailingPE != null ? fund.trailingPE.toFixed(1) : '—';
    let targetText = '—';
    if (fund.targetMean != null) {
      targetText = '$' + fund.targetMean.toFixed(2);
      if (data.currentPrice) {
        const upside = (fund.targetMean / data.currentPrice - 1) * 100;
        const upCls = upside >= 0 ? 'pos' : 'neg';
        targetText += ` <span class="${upCls}">${upside >= 0 ? '+' : ''}${upside.toFixed(1)}%</span>`;
      }
    }
    const rangeTitle = (fund.targetLow != null && fund.targetHigh != null)
      ? `Analyst range: $${fund.targetLow.toFixed(2)} – $${fund.targetHigh.toFixed(2)}`
      : '';
    const iv = computeIntrinsic(fund, data.currentPrice);
    let ivHtml = '';
    if (iv) {
      const disc = -iv.premPct;  // positive = discount (price below estimate)
      const ivTitle = 'Simplified estimate — average of: ' + iv.anchors.map(a => `${a.label} = $${a.value.toFixed(0)}`).join(' · ') + '. Not a professional valuation.';
      ivHtml = `
        <div class="sc-stat" title="${escHtml(ivTitle)}">
          <span class="sc-stat-label">Intrinsic Est.</span>
          <span class="sc-stat-val">$${iv.value.toFixed(0)} <span class="${disc >= 0 ? 'pos' : 'neg'}">${Math.abs(disc).toFixed(0)}% ${disc >= 0 ? 'discount' : 'premium'}</span></span>
        </div>`;
    }
    fundHtml = `
      <div class="sc-stats">
        <div class="sc-stat" title="Trailing 12-month price-to-earnings ratio">
          <span class="sc-stat-label">P/E (TTM)</span>
          <span class="sc-stat-val">${peText}</span>
        </div>
        <div class="sc-stat" title="${rangeTitle}">
          <span class="sc-stat-label">Avg Price Target</span>
          <span class="sc-stat-val">${targetText}</span>
        </div>
        <div class="sc-stat" title="Number of analysts contributing to the average target">
          <span class="sc-stat-label">Analysts</span>
          <span class="sc-stat-val">${fund.analysts ?? '—'}</span>
        </div>
        ${ivHtml}
      </div>`;
  }

  // Price Movement Autopsy: expandable evidence-backed breakdown
  let autopsyHtml = '';
  if (attr || (fund && (fund.earnHistory?.length || fund.own))) {
    const apOpen = autopsyOpen.has(stock.ticker);
    autopsyHtml = `<button class="autopsy-toggle" onclick="toggleAutopsy('${stock.ticker}')">${apOpen ? '▾' : '▸'} 🔬 Today's Move Explained${attr ? ` — confidence <span style="color:${attr.confidence >= 65 ? 'var(--up)' : attr.confidence >= 35 ? 'var(--market)' : 'var(--down)'}">${attr.confidence}%</span>` : ''}</button>`;
    if (apOpen) autopsyHtml += buildAutopsyHtml(stock, r);
  }

  // Company Health Rating: toggleable color-coded category scores
  let healthHtml = '';
  const health = fund ? computeHealth(fund.m) : null;
  if (health) {
    const open = healthOpen.has(stock.ticker);
    const scored = health.filter(c => c.score != null);
    const overall = scored.length ? scored.reduce((a, c) => a + c.score, 0) / scored.length : null;
    healthHtml = `<button class="health-toggle" onclick="toggleHealth('${stock.ticker}')">${open ? '▾' : '▸'} Company Health Rating${overall != null ? ` — <span style="color:${healthColor(overall)}">${healthVerdict(overall)}</span>` : ''}</button>`;
    if (open) {
      healthHtml += `<div class="health-section">` + health.map(c => c.score == null
        ? `<div class="health-row">
            <span class="health-label">${c.label}</span>
            <div class="health-bar-bg"></div>
            <span class="health-verdict" style="color:var(--muted)">${c.naText || 'N/A'}</span>
          </div>`
        : `<div class="health-row">
            <span class="health-label">${c.label}</span>
            <div class="health-bar-bg"><div class="health-bar-fill" style="width:${c.score.toFixed(0)}%;background:${healthColor(c.score)}"></div></div>
            <span class="health-verdict" style="color:${healthColor(c.score)}">${healthVerdict(c.score)}</span>
          </div>`).join('') +
        `<p class="help" style="margin-top:6px">Heuristic scores computed from Yahoo Finance fundamentals (ROE, debt, liquidity, margins, P/E, dividend yield, etc.). Green = excellent, blue = moderate, red = stay away. Not investment advice.</p></div>`;
    }
  }

  return `
    <div class="stock-card ${flagged ? 'is-flagged' : ''}">
      <div class="sc-header">
        <div class="sc-title">
          <span class="sc-ticker">${stock.ticker}</span>
          <span class="sc-badge ${flagged ? 'badge-flagged' : 'badge-normal'}">${flagged ? '⚠ Flagged' : '● Watching'}</span>
        </div>
        <button class="sc-remove" onclick="removeStock('${stock.ticker}')" title="Remove">✕</button>
      </div>
      <div class="sc-name">${data.name || ''}</div>
      <div class="sc-price-row">
        <span class="sc-price">$${data.currentPrice?.toFixed(2) ?? '—'}</span>
        <span class="sc-change ${changeClass}">${changeSign}${change?.toFixed(2) ?? '—'}%</span>
      </div>
      <div class="sc-meta">
        Threshold: ±${stock.threshold}% &nbsp;·&nbsp; Sector: ${stock.sector}
        ${eventHtml}
      </div>
      ${fundHtml}
      ${healthHtml}
      ${autopsyHtml}
      ${attrHtml}
    </div>
  `;
}

function mountChart(ticker, attr) {
  const canvas = document.getElementById(`chart-${ticker}`);
  if (!canvas) return;
  if (chartInstances[ticker]) chartInstances[ticker].destroy();

  chartInstances[ticker] = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['Market', 'Industry', 'Company'],
      datasets: [{
        data: [attr.mPct, attr.iPct, attr.cPct],
        backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6'],
        borderColor: '#13162a',
        borderWidth: 3,
        hoverOffset: 4
      }]
    },
    options: {
      responsive: false,
      cutout: '62%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.parsed.toFixed(1)}%`
          }
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════
//  TICKER AUTOCOMPLETE
// ═══════════════════════════════════════════════════════════
let _suggestTimer = null;
let _suggestIndex = -1;
let _suggestItems = [];

async function fetchSuggestions(query) {
  const url = `https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=7&newsCount=0&listsCount=0`;
  for (const fn of PROXY_FNS) {
    try {
      const r = await fetch(fn(url));
      if (!r.ok) continue;
      const j = await r.json();
      return (j?.finance?.result?.[0]?.quotes || j?.quotes || [])
        .filter(q => q.symbol && q.quoteType !== 'MUTUALFUND')
        .slice(0, 7)
        .map(q => ({ symbol: q.symbol, name: q.shortname || q.longname || q.symbol, type: q.quoteType || '' }));
    } catch {}
  }
  return [];
}

function renderSuggestions(items) {
  const box = document.getElementById('ticker-suggest');
  if (!box) return;
  _suggestItems = items;
  _suggestIndex = -1;
  if (!items.length) { box.style.display = 'none'; return; }
  box.innerHTML = items.map((it, i) =>
    `<div class="suggest-item" data-i="${i}" onmousedown="selectSuggestion(${i})">
      <span class="suggest-sym">${it.symbol}</span>
      <span class="suggest-name">${it.name}</span>
      <span class="suggest-type">${it.type}</span>
    </div>`
  ).join('');
  box.style.display = 'block';
}

function selectSuggestion(i) {
  const it = _suggestItems[i];
  if (!it) return;
  const inp = document.getElementById('inp-ticker');
  inp.value = it.symbol;
  closeSuggestions();
}

function closeSuggestions() {
  const box = document.getElementById('ticker-suggest');
  if (box) box.style.display = 'none';
  _suggestIndex = -1;
}

function onTickerInput(e) {
  const q = e.target.value.trim();
  clearTimeout(_suggestTimer);
  if (q.length < 1) { closeSuggestions(); return; }
  _suggestTimer = setTimeout(async () => {
    const items = await fetchSuggestions(q);
    renderSuggestions(items);
  }, 220);
}

function onTickerKeydown(e) {
  const box = document.getElementById('ticker-suggest');
  const visible = box && box.style.display !== 'none';
  if (e.key === 'Enter') {
    if (visible && _suggestIndex >= 0) { e.preventDefault(); selectSuggestion(_suggestIndex); }
    else { closeSuggestions(); addStock(); }
    return;
  }
  if (e.key === 'Escape') { closeSuggestions(); return; }
  if (!visible) return;
  const rows = box.querySelectorAll('.suggest-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _suggestIndex = Math.min(_suggestIndex + 1, rows.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _suggestIndex = Math.max(_suggestIndex - 1, -1);
  } else { return; }
  rows.forEach((r, i) => r.classList.toggle('active', i === _suggestIndex));
  if (_suggestIndex >= 0) document.getElementById('inp-ticker').value = _suggestItems[_suggestIndex].symbol;
}

// Close suggestions when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('#inp-ticker') && !e.target.closest('#ticker-suggest')) closeSuggestions();
});

// ═══════════════════════════════════════════════════════════
//  STOCK MANAGEMENT
// ═══════════════════════════════════════════════════════════
function addStock() {
  const ticker = document.getElementById('inp-ticker').value.trim().toUpperCase();
  const sector = document.getElementById('inp-sector').value;
  const threshold = parseFloat(document.getElementById('inp-thresh').value);

  if (!ticker) return alert('Enter a ticker symbol.');
  if (!sector) return alert('Select a sector.');
  if (isNaN(threshold) || threshold <= 0) return alert('Enter a valid threshold percentage.');
  if (trackedStocks.find(s => s.ticker === ticker)) return alert(`${ticker} is already tracked.`);

  trackedStocks.push({ ticker, sector, threshold });
  saveStocks();
  document.getElementById('inp-ticker').value = '';
  renderContent();
  refreshAll();
}

function removeStock(ticker) {
  if (chartInstances[ticker]) { chartInstances[ticker].destroy(); delete chartInstances[ticker]; }
  trackedStocks = trackedStocks.filter(s => s.ticker !== ticker);
  delete results[ticker];
  saveStocks();
  renderContent();
}

function saveStocks() {
  localStorage.setItem('smt_stocks', JSON.stringify(trackedStocks));
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function setRefreshBtn(loading) {
  const btn = document.getElementById('refreshBtn');
  if (!btn) return;
  btn.textContent = loading ? '⏳' : '↻ Refresh';
  btn.disabled = loading;
}

function renderBanner(cls, html) {
  const el = document.getElementById('banner');
  if (el) el.innerHTML = `<div class="banner ${cls}">${html}</div>`;
}

importFromHash();
renderApp();
renderContent();
if (!isSignedIn()) renderAuthGate();
refreshTicker();
refreshBrkMoves();
refreshTopStories();
if (trackedStocks.length > 0) refreshAll();
setInterval(refreshAll, REFRESH_MS);
setInterval(refreshTicker, 30 * 60 * 1000);
setInterval(refreshTopStories, 30 * 60 * 1000);
</script>
